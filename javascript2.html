<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  
    <script>
    let score = prompt("점수를 입력하세요.");

    if (score >= 90) {document.write("A");}
    else if (score >= 80) {document.write("B");} 
    else if (score >= 70) {document.write("C");}
    else {document.write("D");}
    </script>
