<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
    let score = prompt("점수를 입력하세요.");

    switch (Math.floor(score / 10)) {
        case 10:
        case 9:
            document.write("A");
            break;
        case 8:
            document.write("B");
            break;
        case 7:
            document.write("C");
            break;
        default:
            document.write("D");
    }
</script>
