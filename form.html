<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 폼</title>
</head>
<body>
    <h1>회원가입 양식</h1>
    <form name="fm1" method="get" action="">
        이 름:<input type="text" name="t1" value=""><br>
        아이디:<input type="text" name="t2" value=""><br>
        비밀번호:<input type="password" name="p1" value=""><br>
        이메일:<input type="email" name="e1" value=""><br>
        <input type="button" name="b1" value="중복확인"><br>

        관심 분야(모두 선택)<br>
        <input type="checkbox" name="c1" value="cv1">웹 개발<br>
        <input type="checkbox" name="c2" value="cv2">앱 개발<br>
        <input type="checkbox" name="c3" value="cv3">인공지능<br>

        <br>
        학년(하나만 선택)<br>
        <input type="radio" name="r1" value="rv1">1학년<br>
        <input type="radio" name="r1" value="rv2">2학년<br>
        <input type="radio" name="r1" value="rv3">3학년<br>
        <input type="radio" name="r1" value="rv4">4학년<br>
        <hr>

        학과:
        <select name="s1">
            <option value="sv1">컴퓨터공학과</option>
            <option value="sv2">소프트웨어학과</option>
            <option value="sv3">정보통신학과</option>
        </select><br>

        자기소개:<br>
        <textarea name="ta1" rows="4" cols="40"></textarea><br>

        <input type="hidden" name="h1" value="hv1"><br>
        <input type="submit" value="가입하기">
        <input type="reset" value="다시쓰기">
    </form>
</body>
</html>
