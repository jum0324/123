<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jQuery 사진 사라지는 마법</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function(){
            $('button').click(function(){
                $('img').toggle(1000);
            });
        });
               
    </script>
</head>

<body>
    <h1>jQuery 사진</h1>
    <p>사라지기</p>
    <img src="https://placehold.co/100x100"><br>
    <button>클릭하세요.</button>
</body>
</html>
