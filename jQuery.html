<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jQuery 예제</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(document).ready(function(){
    $('p').hover(function(){
        $(this).css('color','red');}
                 ,function(){ $(this).css('color','');
                            });
});
</script>
</head>

    <body>
    <h1>jQuery 예제</h1>
    <p>삼육대학교</p>
    <p id="t1">인공지능융합학부</p>
    <p id="t2">웹프로그래밍</p>
     <button>클릭하세요.</button>
</body>
</html>
